<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intel Sustainability Timeline</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="navbar">
    <div class="arc-logo">
      <span class="intel-text">intel</span>
      <span class="arc-text">ARC</span>
    </div>

    <nav>
      <a href="#timeline">Learn More</a>
    </nav>
  </header>

  <main class="hero">

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <section class="hero-center">
      <p class="small-title">SUSTAINABILITY THROUGH THE AGES</p>

      <h1 class="intel-burst">INTEL</h1>

      <p class="hero-message">
        Explore Intel's journey through time, innovation, and sustainability.
      </p>
    </section>

    <section class="timeline web-timeline" id="timeline">

  <article class="timeline-image-card card-one">
    <img src="images/Intel-1968 c.png" alt="1968 Intel Founded">
  </article>

  <article class="timeline-image-card card-two">
    <img src="images/Intel-1971 c.png" alt="1971 First Microprocessor">
  </article>

  <article class="timeline-image-card card-three">
    <img src="images/Intel-1978 c.png" alt="1978 8086 Processor">
  </article>

  <article class="timeline-image-card card-four">
    <img src="images/Intel-2000s c.png" alt="2000s Efficiency Focus">
  </article>

  <article class="timeline-image-card card-five">
    <img src="images/Intel-2020s c.png" alt="2020s Climate Goals">
  </article>

  <article class="timeline-image-card card-six">
    <img src="images/Intel-Future c.png" alt="Future Cleaner Innovation">
  </article>

</section>

  </main>

  <footer class="footer">
    <div class="footer-links">
      <a href="#">Support</a>
      <a href="#">Company Overview</a>
      <a href="#">Public Policy</a>
      <a href="#">Careers</a>
    </div>

    <div class="footer-brand">
      <div class="wide-logo">
        <span>INTEL</span>
        <strong>SUSTAINS</strong>
      </div>

      <div class="socials">
        <span>𝕏</span>
        <span>in</span>
        <span>▶</span>
        <span>◎</span>
      </div>
    </div>
  </footer>

</body>
</html>
